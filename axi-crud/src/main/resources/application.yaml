spring:
  application:
    name: axi-crud

  datasource:
    url: jdbc:mysql://localhost:3306/axidb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "1234"

  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
